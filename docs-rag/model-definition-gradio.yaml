# Model service definition for the Gradio chat UI.
#
# See model-definition-fastapi.yaml — this is the same file with a different
# argument to serve.sh.
#
# The health check uses /health rather than /, which docs_rag/ui.py registers on
# Gradio's underlying FastAPI app: / requires the login, so probing it would
# report an authenticated service as unhealthy.
models:
  - name: "docs-rag-gradio"
    model_path: "/pipeline/vfroot"
    service:
      # Install the dependencies before the service is expected to listen.
      # A fresh container has no venv, and building one inline kept the port
      # closed for minutes — long enough for the platform to kill it.
      pre_start_actions:
        - action: run_command
          args:
            command: ["/bin/bash", "/pipeline/vfroot/docs-rag/pipeline/serve.sh", "setup"]
      start_command:
        - /bin/bash
        - /pipeline/vfroot/docs-rag/pipeline/serve.sh
        - gradio
      port: "8080"
      health_check:
        path: /
        max_retries: 500
        max_wait_time: 60.0
        expected_status_code: 200
        initial_delay: 300.0
