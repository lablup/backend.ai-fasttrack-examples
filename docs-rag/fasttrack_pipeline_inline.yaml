      cpu: 2
      mem: 8g
    resource_opts:
      shmem: 512m
    service:
      name: docs-rag-api
      # A dummy: the definition is read from the pipeline output mount, so this
      # folder need only exist. Backend.AI always mounts one for a model service.
      model: your_model_folder
      model_mount_destination: /models
      # Relative — FastTrack resolves this against model_mount_destination, so an
