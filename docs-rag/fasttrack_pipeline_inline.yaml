# docs-rag — self-contained variant. Everything is configured in this one file.
#
#   fetch-code → clone-docs → convert-docs → build-indices → verify-indices
#     → evaluate → publish → stage-service → { serve-fastapi, serve-gradio }
#
# USE THIS FILE IF you want to type your settings straight into the pipeline and
# upload nothing. Use fasttrack_pipeline.yaml instead if you would rather keep
# your API key in the Secrets store or in a .env file.
#
# TO RUN
#   1. Fill in OPENAI_API_KEY below. That is the only required value — every
#      other setting is already filled in with its default.
#   2. Create the pipeline from this file, selecting a model storage folder in
#      the dialog. Nothing needs to be uploaded into it; the pipeline writes the
#      indices and the services' code there itself. (Model storage is required
#      because a Backend.AI model service always mounts one.)
#   3. Dry Run, then Run.
#
# No vFolder is named anywhere in this file, so it runs under any account.
#
# Everything from `params:` down is a verbatim copy of the task graph in
# fasttrack_pipeline.yaml. Keep the two in step when you change the DAG —
# tests/unit/test_pipeline_wiring.py fails if they diverge.
#
# ⚠ This file will contain your API key once you fill it in. Treat it as a
#   secret: do not commit it or paste it into a ticket. If that matters to you,
#   use fasttrack_pipeline.yaml with ${{ secrets.OPENAI_API_KEY }} instead.
#
# ⚠ Some clusters do not propagate `environment.envs` into the container. If a
#   task logs "missing required env var", that is what happened — that cluster
#   needs the .env route in fasttrack_pipeline.yaml.
version: 26.4.4rc6
name: docs-rag
description: Clone Backend.AI OSS docs, build hybrid FAISS+BM25 indices, evaluate answer quality, and serve a Gradio UI and an OpenAI-compatible API.
ownership:
  domain: default
  scope: user

environment:
  envs:
    OPENAI_API_KEY: ""

    # === everything below is optional; the values shown are the defaults ==

    # --- LLM and embeddings ----------------------------------------------
    # Blank OPENAI_BASE_URL means api.openai.com. Point it at a vLLM server or
    # a Backend.AI model service to use your own endpoint.
    
    LLM_MODEL: "gpt-4.1"
    # Changing EMBEDDING_MODEL after the indices exist needs a full rebuild.
    EMBEDDING_MODEL: "text-embedding-3-small"
    # Qwen-style chain of thought. Only applied when OPENAI_BASE_URL is set.
    ENABLE_THINKING: "false"
    TEMPERATURE: "0.2"
    MAX_TOKENS: "4096"

    # --- indexing ---------------------------------------------------------
    CHUNK_SIZE: "1000"
    CHUNK_OVERLAP: "100"

    # --- retrieval --------------------------------------------------------
    # Chunks pulled from each corpus before pooling.
    K_PER_PROJECT: "10"
    # Chunks sent to the model.
    GLOBAL_TOP_K: "15"
    # Reciprocal Rank Fusion constant; higher flattens the weighting.
    RRF_K: "60"
    # L2 confidence cutoff, and the verify node's canary threshold.
    MAX_L2: "1.5"
    MAX_CHARS_PER_CHUNK: "4000"

    # --- service access ---------------------------------------------------
    # Leave all three blank and the stage-service node generates fresh ones for
    # each run and prints them at the end of its log. Fill in all three to pin
    # them; partial values are ignored on purpose, since a half-filled login
    # would leave a service half-protected.
    GRADIO_USERNAME: ""
    GRADIO_PASSWORD: ""
    API_KEY: ""

    # --- evaluation -------------------------------------------------------
    EVAL_JUDGE_MODEL: "gpt-4.1"
    # 0 scores every question in the committed fixture.
    EVAL_SAMPLE_SIZE: "0"

    # --- cloning private sources -----------------------------------------
    # Only needed if you add a private repo to pipeline/config/sources.yaml.
    # All five defaults are public.
    GITHUB_TOKEN: ""

    # --- pin the example revision ----------------------------------------
    # A tag or branch of the examples repo for fetch-code to clone.
    DOCSRAG_REF: "feat/docs-rag-example"

    # --- mount points -----------------------------------------------------
    # FastTrack's layout. Change these only if your cluster differs.
    PIPELINE_OUTPUT_ROOT: /pipeline/outputs
    PIPELINE_INPUT_ROOT: /pipeline/input1
    PIPELINE_VFROOT: /pipeline/vfroot
    # Where stage-service mirrors the model definitions, .env and
    # credentials. A batch mount by name lands at /home/work/<name>.
    PIPELINE_MODEL_STORAGE: /home/work/your_model_folder
    # Where fetch-code puts the checkout every other node runs from.
    DOCSRAG_SRC: /pipeline/vfroot/src/docs-rag

params: []

tasks:
