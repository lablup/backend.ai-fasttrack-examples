        # a Backend.AI model service to use your own endpoint.
        
        LLM_MODEL: "gpt-4.1"
        # Changing EMBEDDING_MODEL after the indices exist needs a full rebuild.
        EMBEDDING_MODEL: "text-embedding-3-small"
        # Qwen-style chain of thought. Only applied when OPENAI_BASE_URL is set.
        ENABLE_THINKING: "false"
        TEMPERATURE: "0.2"
        MAX_TOKENS: "4096"

        # --- indexing ---------------------------------------------------------
        CHUNK_SIZE: "1000"
        CHUNK_OVERLAP: "100"

        # --- retrieval --------------------------------------------------------
        # Chunks pulled from each corpus before pooling.
        K_PER_PROJECT: "10"
        # Chunks sent to the model.
        GLOBAL_TOP_K: "15"
        # Reciprocal Rank Fusion constant; higher flattens the weighting.
        RRF_K: "60"
        # L2 confidence cutoff, and the verify node's canary threshold.
        MAX_L2: "1.5"
        MAX_CHARS_PER_CHUNK: "4000"

        # --- service access ---------------------------------------------------
        # Leave all three blank and the stage-service node generates fresh ones for
        # each run and prints them at the end of its log. Fill in all three to pin
        # them; partial values are ignored on purpose, since a half-filled login
        # would leave a service half-protected.
        GRADIO_USERNAME: ""
        GRADIO_PASSWORD: ""
        API_KEY: ""

        # --- evaluation -------------------------------------------------------
        EVAL_JUDGE_MODEL: "gpt-4.1"
        # 0 scores every question in the committed fixture.
        EVAL_SAMPLE_SIZE: "0"

        # --- cloning private sources -----------------------------------------
        # Only needed if you add a private repo to pipeline/config/sources.yaml.
        # All five defaults are public.
        GITHUB_TOKEN: ""

        # --- pin the example revision ----------------------------------------
        # A tag or branch of the examples repo for fetch-code to clone.
        DOCSRAG_REF: "feat/docs-rag-example"

        # --- mount points -----------------------------------------------------
        # FastTrack's layout. Change these only if your cluster differs.
        PIPELINE_OUTPUT_ROOT: /pipeline/outputs
        PIPELINE_INPUT_ROOT: /pipeline/input1
        PIPELINE_VFROOT: /pipeline/vfroot
        # Where stage-service mirrors the model definitions, .env and
        # credentials. A batch mount by name lands at /home/work/<name>.
        PIPELINE_MODEL_STORAGE: /home/work/your_model_folder
        # Where fetch-code puts the checkout every other node runs from.
        DOCSRAG_SRC: /pipeline/vfroot/src/docs-rag
    resources:
      cpu: 2
      mem: 4g
    resource_opts:
      shmem: 256m
    command: |-
      set -eu
      cd "${DOCSRAG_SRC:-/pipeline/vfroot/src/docs-rag}"
      bash pipeline/bootstrap.sh pipeline/tasks/06_publish.py --project all

