  - name: fetch-code
    description: Clone this examples repo into the shared pipeline folder, so every later node runs the same revision.
    type: custom
    dependencies: []
    skip: false
    continue_on_failure: false
    cluster_mode: single-node
    cluster_size: 1
    module_uri: ''
    environment:
      project: H100
      scaling-group: nvidia-H100
      image: cr.backend.ai/testing/python:3.11-ubuntu22.04
      envs:
        OPENAI_API_KEY: ""

        # === everything below is optional; the values shown are the defaults ==

        # --- LLM and embeddings ----------------------------------------------
        # Blank OPENAI_BASE_URL means api.openai.com. Point it at a vLLM server or
