        # them; partial values are ignored on purpose, since a half-filled login
        # would leave a service half-protected.
        GRADIO_USERNAME: ""
        GRADIO_PASSWORD: ""
        API_KEY: ""

        # --- evaluation -------------------------------------------------------
        EVAL_JUDGE_MODEL: "gpt-4.1"
        # 0 scores every question in the committed fixture.
        EVAL_SAMPLE_SIZE: "0"

        # --- cloning private sources -----------------------------------------
        # Only needed if you add a private repo to pipeline/config/sources.yaml.
        # All five defaults are public.
        GITHUB_TOKEN: ""

        # --- pin the example revision ----------------------------------------
        # A tag or branch of the examples repo for fetch-code to clone.
        DOCSRAG_REF: "feat/docs-rag-example"

        # --- mount points -----------------------------------------------------
