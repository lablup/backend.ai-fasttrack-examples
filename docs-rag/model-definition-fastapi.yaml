# Model service definition for the OpenAI-compatible API.
#
# Read from the model vfolder named by the task's service.model, which is the one
# thing that must live there. The code and the indices are read from the pipeline
# output mount instead, so stage-service no longer copies them into model storage.
#
# The service is chosen by the argument to serve.sh, not by an environment
# variable, so this file and its Gradio twin cannot both start the same app.
models:
  - name: "docs-rag-fastapi"
    model_path: "/pipeline/outputs"
    service:
      start_command:
        - /bin/bash
        - /pipeline/outputs/docs-rag/pipeline/serve.sh
        - fastapi
      port: "8000"
      health_check:
        path: /health
        max_retries: 500
        max_wait_time: 60.0
        expected_status_code: 200
        # First start builds a virtualenv and loads every FAISS index, so give
        # it a few minutes before the first probe.
        initial_delay: 300.0
