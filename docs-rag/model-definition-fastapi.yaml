# Model service definition for the OpenAI-compatible API.
#
# model_path is the model mount itself: the platform validates it, and a path
# outside the mount gets the definition rejected in favour of the default
# runtime. The start command is free to point elsewhere — the code and indices
# live on /pipeline/vfroot, the one /pipeline mount that outlives the run.
#
# The service is chosen by the argument to serve.sh, not by an environment
# variable, so this file and its Gradio twin cannot both start the same app.
models:
  - name: "docs-rag-fastapi"
    model_path: "/models"
    service:
      # Install the dependencies before the service is expected to listen.
      # A fresh container has no venv, and building one inline kept the port
      # closed for minutes — long enough for the platform to kill it.
      pre_start_actions:
        - action: run_command
          args:
            command: ["/bin/bash", "/pipeline/vfroot/docs-rag/pipeline/serve.sh", "setup"]
      start_command:
        - /bin/bash
        - /pipeline/vfroot/docs-rag/pipeline/serve.sh
        - fastapi
      port: "8080"
      health_check:
        path: /
        max_retries: 500
        max_wait_time: 60.0
        expected_status_code: 200
        # First start builds a virtualenv and loads every FAISS index, so give
        # it a few minutes before the first probe.
        initial_delay: 300.0
